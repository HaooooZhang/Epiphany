plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            // ForgeGradle must remap refmaps in the development dependencies.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile.absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = 'https://maven.tysontheember.dev'
        content { includeGroup 'com.lowdragmc.ldlib2' }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

// Keep the FTB Quests and KubeJS APIs on the compile classpath for both profiles.
def integrationConfiguration = providers.gradleProperty('withoutIntegrations').isPresent()
        ? 'compileOnly' : 'implementation'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("com.lowdragmc.ldlib2:ldlib2-forge-${minecraft_version}:${ldlib2_version}")
    runtimeOnly fg.deobf('curse.maven:kotlin-for-forge-351264:7291067')

    add(integrationConfiguration, fg.deobf('curse.maven:ftb-quests-forge-289412:8078538'))
    add(integrationConfiguration, fg.deobf('curse.maven:ftb-library-forge-404465:8226927'))
    add(integrationConfiguration, fg.deobf('curse.maven:ftb-teams-forge-404468:7499810'))
    add(integrationConfiguration, fg.deobf('dev.architectury:architectury-forge:9.2.14'))
    add(integrationConfiguration, fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26'))
    add(integrationConfiguration, fg.deobf('dev.latvian.mods:rhino-forge:2001.2.3-build.10'))
}

tasks.named('processResources', ProcessResources).configure {
    def metadata = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            ldlib2_version         : ldlib2_version,
    ]
    inputs.properties metadata
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand metadata
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    def testRunDirectory = layout.buildDirectory.dir('test-run')
    workingDir testRunDirectory.get().asFile
    doFirst {
        testRunDirectory.get().asFile.mkdirs()
    }
}
